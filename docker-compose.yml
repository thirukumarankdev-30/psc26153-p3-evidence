services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attack_onset_api
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
